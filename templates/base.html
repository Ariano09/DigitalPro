<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalPro Ucayali - Tecnología y Suministros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        .carousel-item img { object-fit: cover; height: 400px; width: 100%; }
        .fs-7 { font-size: 0.85rem; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- Barra de Navegación Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/">DigitalPro Ucayali</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/#buscador">Productos y Servicios</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" href="/servicios-gratuitos"><i class="bi bi-gift-fill"></i> Servicios Gratuitos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Espacio para la Publicidad (Solo se ve en el inicio) -->
    {% block header %}{% endblock %}

    <!-- Contenido Principal de las Páginas -->
    <div class="container my-5 flex-grow-1">
        {% block content %}{% endblock %}
    </div>

    <!-- Pie de Página -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2026 DigitalPro Ucayali. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
